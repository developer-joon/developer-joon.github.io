name: 기업 복지 정보 정정 요청
description: 기업 복지 탐색기의 사실 오류나 누락된 공식 공개자료를 제보합니다.
title: "[복지 정보 정정] "
body:
  - type: markdown
    attributes:
      value: |
        제보는 검토 후 반영됩니다. 개인정보, 사내 문서, 로그인이나 유료 결제가 필요한 자료는 올리지 마세요.
  - type: input
    id: company
    attributes:
      label: 기업명과 법인 식별자
      description: 탐색기에 표시된 기업명과 KR-CRN 또는 US-CIK 식별자를 적어주세요.
      placeholder: 예) 테스트 기업 (KR-CRN-1101112948086)
    validations:
      required: true
  - type: dropdown
    id: correction_type
    attributes:
      label: 요청 유형
      options:
        - 사실 오류
        - 누락된 복지제도
        - 적용 범위 오류
        - 오래된 정보
        - 기업 식별 오류
        - 기타
    validations:
      required: true
  - type: input
    id: official_source
    attributes:
      label: 공식 공개자료 URL
      description: 회사 공식 홈페이지, 공식 채용 페이지, 공시 등 누구나 접근 가능한 HTTPS URL을 입력해주세요.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 수정이 필요한 내용
      description: 현재 표시 내용과 어떻게 달라야 하는지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 적용 범위
      description: 확인 가능한 국가, 법인, 직군, 고용형태, 시점과 제한 조건을 적어주세요.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 공개자료 확인
      options:
        - label: 개인정보나 비공개 사내 자료를 포함하지 않았습니다.
          required: true
        - label: 링크가 로그인이나 유료 결제 없이 공개적으로 접근 가능합니다.
          required: true